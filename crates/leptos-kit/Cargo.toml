[package]
name = "leptos-kit"
description = "A faithful port of shadcn/ui to Leptos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
leptos.workspace = true
leptos-kit-icons.workspace = true
leptos-kit-macros.workspace = true
leptos-kit-primitives.workspace = true

[features]
default = ["lucide"]
lucide = ["leptos-kit-icons/lucide"]
tabler = ["leptos-kit-icons/tabler"]
hugeicons = ["leptos-kit-icons/hugeicons"]
phosphor = ["leptos-kit-icons/phosphor"]
ssr = ["leptos/ssr", "leptos-kit-icons/ssr", "leptos-kit-primitives/ssr"]
hydrate = [
  "leptos/hydrate",
  "leptos-kit-icons/hydrate",
  "leptos-kit-primitives/hydrate",
]

[lints]
workspace = true
