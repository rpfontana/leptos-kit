[package]
name = "leptos-kit-primitives"
description = "Headless, native-first UI primitives for Leptos: a port of Base UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
chrono = { workspace = true, optional = true }
icu_calendar = { workspace = true, optional = true }
icu_datetime = { workspace = true, optional = true }
icu_locale_core = { workspace = true, optional = true }
icu_provider = { workspace = true, optional = true }
jiff = { workspace = true, optional = true }
leptos.workspace = true
leptos-kit-macros.workspace = true
send_wrapper.workspace = true
time = { workspace = true, optional = true }
web-sys = { workspace = true, features = [
  "AddEventListenerOptions",
  "Animation",
  "ClipboardEvent",
  "css",
  "DataTransfer",
  "DomRect",
  "FocusOptions",
  "HtmlButtonElement",
  "HtmlCollection",
  "CssStyleDeclaration",
  "HtmlDialogElement",
  "HtmlDocument",
  "HtmlFormElement",
  "HtmlImageElement",
  "HtmlInputElement",
  "HtmlTextAreaElement",
  "InputEvent",
  "MediaQueryList",
  "MutationObserver",
  "MutationObserverInit",
  "Navigator",
  "NodeList",
  "PointerEvent",
  "ResizeObserver",
  "ScrollBehavior",
  "ScrollIntoViewOptions",
  "ScrollLogicalPosition",
  "ScrollToOptions",
  "Selection",
  "ToggleEvent",
  "Touch",
  "TouchEvent",
  "TouchList",
  "VisibilityState",
  "Window",
] }
wasm-bindgen-futures.workspace = true
writeable = { workspace = true, optional = true }

[features]
# the calendar's day picker, with cldr's names and patterns from icu4x
calendar = ["dep:icu_calendar", "dep:icu_datetime", "dep:icu_locale_core", "dep:icu_provider", "dep:writeable"]
chrono = ["calendar", "dep:chrono"]
jiff = ["calendar", "dep:jiff"]
time = ["calendar", "dep:time"]
ssr = ["leptos/ssr"]
hydrate = ["leptos/hydrate"]

[lints]
workspace = true
