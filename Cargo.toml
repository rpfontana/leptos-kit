[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
leptos = "0.8.20"
leptos-kit-icons = { path = "crates/leptos-kit-icons", version = "0.1.0" }

[patch.crates-io]
leptos_macro = { git = "https://github.com/rpfontana/leptos", branch = "dashed-attrs-on-components" }
